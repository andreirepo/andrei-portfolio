server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://analytics.andreirepo.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://analytics.andreirepo.com; frame-ancestors 'none';" always;

    # Handle the root path by serving index.html from the /en/ subdirectory
    location = / {
        index /en/index.html;
    }

    # Ensure all other requests (CSS, JS, Images) look in the correct place
    location / {
        try_files $uri $uri/ /en/index.html;
    }

    # Explicitly allow access to the assets and en folders
    location /_astro/ {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
