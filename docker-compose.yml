services:
  website:
    image: ghcr.io/andreirepo/andrei-portfolio:main
    container_name: andrei-portfolio-site
    restart: always
    networks:
      - todo-app_traefik-net
    labels:
      - 'traefik.enable=true'
      # !PathPrefix(/apps) keeps this router out of the way of the todo app,
      # which lives on the same host at /apps/todo. Traefik ranks routers by
      # rule length, and this rule (52 chars) is longer than a
      # Host && PathPrefix rule (50) — so without the exclusion this router
      # wins every /apps request and answers with the portfolio's 404.
      - 'traefik.http.routers.andrei-portfolio.rule=(Host(`andreirepo.com`) || Host(`www.andreirepo.com`)) && !PathPrefix(`/apps`)'
      - 'traefik.http.routers.andrei-portfolio.entrypoints=web'

networks:
  todo-app_traefik-net:
    external: true
