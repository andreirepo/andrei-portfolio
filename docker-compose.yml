services:
  website:
    image: ghcr.io/andreirepo/andrei-portfolio:main
    container_name: andrei-portfolio-site
    restart: always
    networks:
      - todo-app_traefik-net
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.andrei-portfolio.rule=Host(`andreirepo.com`) || Host(`www.andreirepo.com`)'
      - 'traefik.http.routers.andrei-portfolio.entrypoints=web'

networks:
  todo-app_traefik-net:
    external: true
