name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Build and Test
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install pnpm
      run: npm install -g pnpm

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ~/.pnpm-store
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build application
      run: pnpm build

    - name: Run type checking
      run: pnpm check-sync

    - name: Validate i18n translations
      run: pnpm check-sync

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-files
        path: dist/

  # Job 2: Docker Build and Push
  build-and-push-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_VERSION=${{ github.sha }}
          BUILD_TIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}

  # Job 3: Deploy to Ubuntu Server with Traefik
  deploy:
    needs: [build-and-test, build-and-push-image]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        # Write the SSH key with proper formatting
        echo "${{ secrets.SERVER_SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
        # Verify the key was written correctly
        if [ ! -f ~/.ssh/id_rsa ] || [ ! -s ~/.ssh/id_rsa ]; then
          echo "ERROR: SSH key file is empty or missing"
          exit 1
        fi
        echo "SSH key file created successfully"
        echo "Key content (first 3 lines):"
        head -3 ~/.ssh/id_rsa
        echo "Key length: $(wc -c < ~/.ssh/id_rsa) bytes"
        
        # Test if the key is valid (try both formats)
        if ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null 2>&1; then
          echo "✅ SSH key is valid"
        else
          echo "❌ SSH key format is invalid"
          echo "Expected format: -----BEGIN OPENSSH PRIVATE KEY-----"
          echo "Your key format: $(head -1 ~/.ssh/id_rsa)"
          echo "Please ensure your SSH key is properly formatted with line breaks"
          exit 1
        fi

    - name: Deploy to Ubuntu server
      env:
        SERVER_HOST: ${{ secrets.SERVER_HOST }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
      run: |
        # SSH config
        echo "StrictHostKeyChecking no" >> ~/.ssh/config
        echo "UserKnownHostsFile=/dev/null" >> ~/.ssh/config
        
        # Copy project files to server
        echo "📦 Copying project files to server..."
        scp -r . ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/home/${{ env.SERVER_USER }}/apps/andrei-portfolio/
        
        # Deploy using dedicated docker-compose file
        echo "🚀 Deploying to server..."
        ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'EOF'
          cd /home/ubuntu/apps/andrei-portfolio
          
          # Pull the latest image
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          
          # Deploy using dedicated docker-compose file
          echo "🔄 Building and starting portfolio service..."
          docker-compose -f docker-compose.prod.yml up -d --build portfolio
          
          # Wait for service to be healthy
          echo "⏳ Waiting for service to be healthy..."
          sleep 10
          
          # Check service status
          echo "✅ Checking service status..."
          docker-compose -f docker-compose.prod.yml ps portfolio
          
          # Test health endpoint
          echo "🏥 Testing health endpoint..."
          curl -f http://localhost/health || echo "⚠️ Health check failed, but deployment may still be in progress"
          
          echo "🎉 Deployment completed successfully!"
        EOF

  # Job 4: Health Check
  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Wait for service to be ready
      run: sleep 120

    - name: Health check
      run: |
        # Test health endpoint on your domain
        curl -f https://andreirepo.com/health || exit 1
        curl -f https://www.andreirepo.com/health || exit 1
        echo "✅ Portfolio is healthy and running at https://andreirepo.com"
