name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NETWORK_NAME: todo-app_traefik-net
  DEPLOY_PATH: "/home/${{ secrets.SERVER_USER }}/apps/github/andrei-portfolio"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application (includes i18n check)
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/

  accessibility-audit:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist/

      - name: Start preview server and run accessibility tests
        run: |
          pnpm preview --port 4321 &
          SERVER_PID=$!

          for i in {1..15}; do
            if curl -sf http://localhost:4321/en > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... attempt $i"
            sleep 2
          done

          pnpm exec vitest --run \
            src/tests/accessibility-contrast-bug-condition.test.ts \
            src/tests/accessibility-full-audit.test.ts
          TEST_EXIT=$?

          kill $SERVER_PID 2>/dev/null || true
          exit $TEST_EXIT

      - name: Upload accessibility test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-test-results
          path: test-results/

  e2e-tests:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist/

      - name: Start preview server and run e2e tests
        run: |
          pnpm preview --port 4321 &
          SERVER_PID=$!

          for i in {1..15}; do
            if curl -sf http://localhost:4321/en > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... attempt $i"
            sleep 2
          done

          pnpm exec vitest --run src/tests/e2e
          TEST_EXIT=$?

          kill $SERVER_PID 2>/dev/null || true
          exit $TEST_EXIT

      - name: Upload e2e test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/

  build-and-push-image:
    needs: [build-and-test, accessibility-audit, e2e-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      previous-tag: ${{ steps.meta.outputs.previous-tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Save current image tag for rollback
        id: save-previous
        run: |
          PREVIOUS_TAG=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/user/packages/container/${{ github.event.repository.name }}/versions" | \
            jq -r 'sort_by(.created_at) | reverse | .[0].metadata.container.tags[]? // empty' | head -1)
          echo "previous-tag=${PREVIOUS_TAG:-none}" >> $GITHUB_OUTPUT
          echo "Previous image tag: $PREVIOUS_TAG"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-and-push-image]
    runs-on: self-hosted
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files to Production Directory
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "mkdir -p ${{ env.DEPLOY_PATH }}"
          rsync -az --delete --exclude='.git' --exclude='node_modules' \
            . ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Docker Compose Up
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} <<'EOF'
            cd ${{ env.DEPLOY_PATH }}
            docker network ls | grep -q "${{ env.NETWORK_NAME }}" || docker network create "${{ env.NETWORK_NAME }}"
            docker compose -f docker-compose.yml pull website
            docker compose -f docker-compose.yml up -d --force-recreate website
          EOF

  health-check:
    needs: deploy
    runs-on: self-hosted
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Wait for service to be ready
        run: sleep 20

      - name: Verify main site (External Check via Cloudflare)
        run: |
          for i in {1..5}; do
            if curl -sf https://andreirepo.com > /dev/null; then
              echo "Site is UP!"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 10
          done
          exit 1

      - name: Purge Cloudflare cache
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

  rollback:
    needs: health-check
    runs-on: self-hosted
    timeout-minutes: 5
    if: failure()
    steps:
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Rollback deployment
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          PREVIOUS_TAG: ${{ needs.build-and-push-image.outputs.previous-tag }}
        run: |
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} <<'EOF'
            cd ${{ env.DEPLOY_PATH }}
            echo "Rolling back to previous image: ${{ env.PREVIOUS_TAG }}"
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PREVIOUS_TAG }}
            docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PREVIOUS_TAG }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker compose -f docker-compose.yml up -d website
          EOF

  cleanup-old-packages:
    needs: health-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main' && success()
    permissions:
      packages: write
    steps:
      - name: Delete old package versions
        run: |
          VERSIONS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/${{ github.event.repository.name }}/versions")
          IDS=$(echo "$VERSIONS" | jq -r 'sort_by(.created_at) | reverse | .[5:] | .[].id // empty')
          if [ -z "$IDS" ]; then
            echo "No old versions to delete"
          else
            echo "$IDS" | while read -r ID; do
              curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/user/packages/container/${{ github.event.repository.name }}/versions/$ID"
            done
            echo "Cleaned up old versions"
          fi
