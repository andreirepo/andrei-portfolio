name: Workflow lint

# Deliberately a separate file rather than a step inside ci-cd.yml.
#
# If ci-cd.yml cannot be compiled, GitHub does not run it at all — so a lint
# step living inside it can never report that ci-cd.yml is broken. The symptom
# is a pull request with no checks and a phantom run named after the file path
# with zero jobs. A separate workflow still runs on that pull request and says
# exactly what is wrong.
#
# actionlint catches what a YAML parse cannot: expression syntax and unknown
# contexts, e.g. a literal empty expression in a comment, `steps.<id>` that
# does not exist, or reading `needs.<job>` from a job that is not in `needs`.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL "$url" -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: Lint workflows
        # -S warning keeps shellcheck's warnings and errors but ignores
        # info-level noise (unquoted $GITHUB_OUTPUT and friends) that predates
        # this job. Tighten to plain shellcheck once that backlog is cleared.
        run: |
          set -euo pipefail
          actionlint -color -shellcheck="shellcheck -S warning"
