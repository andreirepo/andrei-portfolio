name: Deploy Portfolio

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CONTAINER_NAME: andrei-portfolio
  DOCKERFILE_PATH: ./Dockerfile
  SERVER_USER: ubuntu
  SERVER_HOST: your-server-ip-here
  SSH_KEY_PATH: ~/.ssh/id_rsa

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ env.DOCKERFILE_PATH }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Install SSH key
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}

    - name: Deploy to Ubuntu server
      env:
        SERVER_HOST: ${{ secrets.SERVER_HOST }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
      run: |
        # SSH config
        echo "StrictHostKeyChecking no" >> ~/.ssh/config
        echo "UserKnownHostsFile=/dev/null" >> ~/.ssh/config
        
        # Copy project files to server
        echo "📦 Copying project files to server..."
        scp -r . ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/home/${{ env.SERVER_USER }}/apps/andrei-portfolio/
        
        # Deploy using dedicated docker-compose file
        echo "🚀 Deploying to server..."
        ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'EOF'
          cd /home/ubuntu/apps/andrei-portfolio
          
          # Pull the latest image
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          
          # Deploy using dedicated docker-compose file
          echo "🔄 Building and starting portfolio service..."
          docker-compose -f docker-compose.prod.yml up -d --build portfolio
          
          # Wait for service to be healthy
          echo "⏳ Waiting for service to be healthy..."
          sleep 10
          
          # Check service status
          echo "✅ Checking service status..."
          docker-compose -f docker-compose.prod.yml ps portfolio
          
          # Test health endpoint
          echo "🏥 Testing health endpoint..."
          curl -f http://localhost/health || echo "⚠️ Health check failed, but deployment may still be in progress"
          
          echo "🎉 Deployment completed successfully!"
        EOF
